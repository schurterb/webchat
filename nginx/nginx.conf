user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events { 
    worker_connections 768;
}

http {
    server {
        listen  80;
        return  301 https://\$host\$request_uri;
    }
    
    include mime.types;
    server {
        listen              443 ssl;
        ssl_certificate     /home/ubuntu/workspace/webchat/nginx/webchat-dev.crt;
        ssl_certificate_key /home/ubuntu/workspace/webchat/nginx/webchat-dev.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        gzip on;

        root /home/ubuntu/workspace/webchat/www/;
        
        location ~* \.(js|jpg|png|css)$ {
            expires 30d;
            add_header Cache-Control "no-store, no-transform";
        }
        location ~ \.css {
            add_header  Content-Type    text/css;
            add_header Cache-Control "no-store, no-transform";
        }
        location ~ \.js {
            add_header  Content-Type    application/x-javascript;
            add_header Cache-Control "no-store, no-transform";
        }
        
        location /signalling {
            proxy_pass http://localhost:7042;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}